<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline — Cookster</title>
    <link rel="icon" type="image/jpeg" href="/static/cookster-logo.jpg">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container">
      <header class="top">
        <a class="brand" href="/">
          <img src="/static/cookster-logo.jpg" alt="Cookster" class="logo-img">
          <div>
            <h1>Cook<span>ster</span></h1>
            <p>Search your cookbooks</p>
          </div>
        </a>
      </header>

      <div class="offline-message empty">
        <h2>📡 You’re offline</h2>
        <p>Cookster can’t reach the kitchen right now. Your cached pages and lists are still available, but search and new recipes need a connection.</p>
        <p>Check your network and <a href="/">try again</a>.</p>
      </div>
    </div>
    <script src="/static/icons.js" defer></script>
  </body>
</html>
